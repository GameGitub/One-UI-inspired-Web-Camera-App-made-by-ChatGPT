<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OneUI Camera V2</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;font-family:-apple-system,BlinkMacSystemFont,sans-serif;overflow:hidden;color:#fff}
#video{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
.top{position:fixed;top:14px;left:0;right:0;display:flex;justify-content:center;gap:14px;z-index:10}
.icon{width:42px;height:42px;border-radius:50%;background:rgba(0,0,0,.35);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center}
.icon svg{width:20px;height:20px}
.zoom{position:fixed;bottom:170px;left:50%;transform:translateX(-50%);display:flex;gap:10px;z-index:10}
.zoom button{border:none;background:rgba(0,0,0,.45);color:#fff;border-radius:20px;padding:9px 14px}
.zoom .active{background:#fff;color:#000;font-weight:700}
.modes{position:fixed;bottom:115px;left:50%;transform:translateX(-50%);display:flex;gap:22px;z-index:10;font-size:14px}
.modes .active{font-weight:700}
.controls{position:fixed;bottom:20px;left:0;right:0;display:flex;justify-content:space-around;align-items:center;z-index:10}
.side{width:62px;height:62px;border-radius:50%;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center}
.side svg{width:26px;height:26px}
.thumb{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#666,#999)}
#shutter{width:86px;height:86px;border-radius:50%;background:#fff;border:6px solid rgba(255,255,255,.4)}
.recording{box-shadow:0 0 0 8px rgba(255,0,0,.25)}
canvas{display:none}
</style>
</head>
<body>
<video id="video" autoplay playsinline muted></video>

<div class="top">
<div class="icon"><svg viewBox="0 0 24 24"><path fill="white" d="M13 2L5 14H11L10 22L19 9H13z"/></svg></div>
<div class="icon"><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8" stroke="white" stroke-width="2"/><path d="M12 7v5l3 2" stroke="white" stroke-width="2"/></svg></div>
<div class="icon"><span style="font-size:12px">3:4</span></div>
<div class="icon"><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="3" stroke="white" stroke-width="2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3" stroke="white" stroke-width="2"/></svg></div>
</div>

<div class="zoom">
<button class="active" data-z="1">1x</button>
<button data-z="2">2x</button>
<button data-z="3">3x</button>
</div>

<div class="modes">
<div>PORTRAIT</div>
<div class="active">PHOTO</div>
<div>VIDEO</div>
<div>MORE</div>
</div>

<div class="controls">
<div class="side"><div class="thumb"></div></div>
<div id="shutter"></div>
<div class="side" id="flip">
<svg viewBox="0 0 24 24" fill="none">
<path d="M7 8H18L16 6M18 8L16 10" stroke="white" stroke-width="2" stroke-linecap="round"/>
<path d="M17 16H6L8 18M6 16L8 14" stroke="white" stroke-width="2" stroke-linecap="round"/>
</svg>
</div>
</div>

<canvas id="canvas"></canvas>

<script>
let facing='environment',stream,mediaRecorder,chunks=[];
const video=document.getElementById('video');

async function startCam(){
 try{
  if(stream) stream.getTracks().forEach(t=>t.stop());
  stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing},audio:true});
  video.srcObject=stream;
 }catch(e){alert('Camera permission required');}
}
startCam();

flip.onclick=()=>{
 facing=facing==='environment'?'user':'environment';
 startCam();
};

document.querySelectorAll('.zoom button').forEach(btn=>{
 btn.onclick=()=>{
  document.querySelectorAll('.zoom button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  video.style.transform='scale('+btn.dataset.z+')';
 };
});

document.querySelectorAll('.modes div').forEach(m=>{
 m.onclick=()=>{
  document.querySelectorAll('.modes div').forEach(x=>x.classList.remove('active'));
  m.classList.add('active');
 };
});

shutter.onclick=()=>{
 const mode=document.querySelector('.modes .active').textContent;

 if(mode==='VIDEO'){
   if(!mediaRecorder || mediaRecorder.state==='inactive'){
      chunks=[];
      mediaRecorder=new MediaRecorder(stream);
      mediaRecorder.ondataavailable=e=>chunks.push(e.data);
      mediaRecorder.onstop=()=>{
       const blob=new Blob(chunks,{type:'video/webm'});
       const a=document.createElement('a');
       a.href=URL.createObjectURL(blob);
       a.download='video.webm';
       a.click();
      };
      mediaRecorder.start();
      shutter.classList.add('recording');
   }else{
      mediaRecorder.stop();
      shutter.classList.remove('recording');
   }
 }else{
   const c=document.getElementById('canvas');
   c.width=video.videoWidth;
   c.height=video.videoHeight;
   c.getContext('2d').drawImage(video,0,0);
   const a=document.createElement('a');
   a.href=c.toDataURL('image/png');
   a.download='photo.png';
   a.click();
 }
};
</script>
</body>
</html>
